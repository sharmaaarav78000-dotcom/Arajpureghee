kind = "web"
previewPath = "/digital-detox/"
title = "Digital Detox Project"
version = "1.0.0"
id = "artifacts/digital-detox"
router = "path"

[[services]]
name = "web"
paths = [ "/digital-detox/" ]
localPort = 23675

[services.development]
run = "pnpm --filter @workspace/digital-detox run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/digital-detox", "run", "build" ]
serve = "static"
publicDir = "artifacts/digital-detox/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23675"
BASE_PATH = "/digital-detox/"
